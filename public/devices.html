<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devices | GWE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; background: #f9fafb; }
    /* Replaced @apply rules with equivalent static CSS because @apply requires Tailwind/PostCSS processing */
    .status-online {
      background-color: #dcfce7; /* approximate Tailwind bg-green-100 */
      color: #14532d;           /* approximate Tailwind text-green-800 */
      padding: 0.125rem 0.5rem; /* matches px-2 py-0.5 */
      font-weight: 500;         /* matches font-medium */
      border-radius: 9999px;    /* rounded-full */
      font-size: 0.75rem;       /* text-xs */
      display: inline-block;
    }
    .status-offline {
      background-color: #fee2e2; /* approximate Tailwind bg-red-100 */
      color: #991b1b;            /* approximate red text */
      padding: 0.125rem 0.5rem;
      font-weight: 500;
      border-radius: 9999px;
      font-size: 0.75rem;
      display: inline-block;
    }
  </style>
</head>
<body class="p-4 sm:p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-xl sm:text-2xl font-bold text-gwe-dark mb-6">All Devices (26)</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg border border-gwe-grey p-4 hover:shadow transition">
        <div class="flex justify-between items-start mb-2">
          <h3 class="font-semibold text-sm">Inverter #4</h3>
          <span class="status-online text-xs px-2 py-0.5 rounded-full font-medium">Online</span>
        </div>
        <p class="text-xs text-gwe-grey mb-2">Solar Farm 12</p>
        <div class="text-xs space-y-1">
          <div class="flex justify-between"><span>Temp:</span> <strong>42°C</strong></div>
          <div class="flex justify-between"><span>Uptime:</span> <strong>48h</strong></div>
        </div>
      </div>
      <!-- Repeat for more devices -->
    </div>
  </div>
<script>feather.replace();</script>
</body>
</html>
