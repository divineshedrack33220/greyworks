<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerts | GWE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; margin: 0; background: #f9fafb; }</style>
</head>
<body class="p-4 sm:p-6">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-xl sm:text-2xl font-bold text-gwe-dark mb-6">Recent Alerts</h1>
    <div class="space-y-3">
      <div class="flex items-start p-4 bg-red-50 border-l-4 border-gwe-red rounded">
        <i data-feather="alert-triangle" class="w-5 h-5 text-gwe-red mt-0.5"></i>
        <div class="ml-3 flex-1">
          <p class="font-medium">Inverter #4 Overheating</p>
          <p class="text-xs text-gwe-grey">Solar Farm 12 • 2 min ago</p>
        </div>
      </div>
      <!-- More alerts -->
    </div>
  </div>
<script>feather.replace();</script>
</body>
</html>
